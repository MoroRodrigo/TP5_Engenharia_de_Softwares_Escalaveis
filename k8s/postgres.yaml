apiVersion: v1
kind: Service
metadata:
  name: postgres-estoque
spec:
  clusterIP: None
  selector:
    app: postgres-estoque
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-estoque
spec:
  serviceName: postgres-estoque
  replicas: 1
  selector:
    matchLabels:
      app: postgres-estoque
  template:
    metadata:
      labels:
        app: postgres-estoque
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: POSTGRES_ESTOQUE_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: POSTGRES_ESTOQUE_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: POSTGRES_ESTOQUE_PASSWORD}}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-inventory
spec:
