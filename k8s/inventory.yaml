apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: tp5-inventory-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_URL
              value: jdbc:postgresql://postgres-inventory:5432/inventory
            - name: DB_DRIVER
              value: org.postgresql.Driver
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: POSTGRES_INVENTORY_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: POSTGRES_INVENTORY_PASSWORD}}
            - name: JPA_DDL_AUTO
              value: update
            - name: JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: H2_CONSOLE_ENABLED
              value: "false"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: RABBITMQ_USERNAME}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: tp5-secrets, key: RABBITMQ_PASSWORD}}
            - name: OTEL_EXPORT_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo:4318/v1/traces
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            initialDelaySeconds: 30
            periodSeconds: 20
