name: CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ env.IMAGE_PREFIX }}/backend:latest
      - name: Build e push inventory-service
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-service
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}/inventory-service:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ env.IMAGE_PREFIX }}/inventory-service:latest
      - name: Build e push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ env.IMAGE_PREFIX }}/frontend:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Configurar kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
      - name: Aplicar manifests
        run: kubectl apply -k k8s
      - name: Atualizar imagens
        run: |
          kubectl -n tp5 set image deployment/backend backend=ghcr.io/${{ env.IMAGE_PREFIX }}/backend:${{ needs.publish.outputs.tag }}
          kubectl -n tp5 set image deployment/inventory-service inventory-service=ghcr.io/${{ env.IMAGE_PREFIX }}/inventory-service:${{ needs.publish.outputs.tag }}
          kubectl -n tp5 set image deployment/frontend frontend=ghcr.io/${{ env.IMAGE_PREFIX }}/frontend:${{ needs.publish.outputs.tag }}
      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/backend -n tp5 --timeout=240s
          kubectl rollout status deployment/inventory-service -n tp5 --timeout=240s
          kubectl rollout status deployment/frontend -n tp5 --timeout=240s
      - name: Mostrar estado
        run: |
          kubectl get pods -n tp5 -o wide
          kubectl get hpa -n tp5
